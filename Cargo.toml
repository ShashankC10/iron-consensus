[workspace]
members = [
    "crates/iron-core",
    "crates/iron-wal",
    "crates/iron-transport",
    "crates/iron-protocol",
    "crates/iron-testkit",
    "crates/iron-foundation-tests",
    "crates/iron-runtime",
    "crates/iron-grpc",
    "crates/iron-2pc",
    "crates/iron-3pc",
    "crates/iron-raft",
    "crates/iron-multipaxos",
    "crates/iron-coordinator",
    "crates/iron-participant",
    "crates/iron-consensus-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
crc32c = "0.6"
fs2 = "0.4"
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
